name: Build dfroot.ko for SM-A037F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make bc libssl-dev \
            unzip python3

      - name: Download kernel source
        run: |
          wget -O kernel_src.zip \
            "https://github.com/pixelontopp/DFRoot/releases/download/%23idk/SM-A037F_13_Opensource.zip"
          ls -lh kernel_src.zip

      - name: Extract and inspect
        run: |
          unzip kernel_src.zip -d kernel_raw
          echo "=== TOP LEVEL CONTENTS ==="
          ls -la kernel_raw/
          echo "=== SECOND LEVEL ==="
          ls -la kernel_raw/*/ 2>/dev/null || true
          echo "=== LOOKING FOR KERNEL DIR ==="
          find kernel_raw -maxdepth 3 -type d | sort
          echo "=== LOOKING FOR TAR FILES ==="
          find kernel_raw -name "*.tar*" -o -name "*.gz" | head -20
          echo "=== LOOKING FOR arch DIRECTORY ==="
          find kernel_raw -type d -name "arch" | head -5
          echo "=== LOOKING FOR Kconfig ==="
          find kernel_raw -name "Kconfig" -maxdepth 5 | head -5

      - name: Prepare kernel headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Find the real kernel root
          KERNEL_ROOT=$(find kernel_raw -type d -name "arch" \
            | head -1 | xargs dirname)

          if [ -z "$KERNEL_ROOT" ]; then
            # Maybe it's inside a tar
            INNER_TAR=$(find kernel_raw -name "*.tar*" | head -1)
            if [ -n "$INNER_TAR" ]; then
              mkdir real_kernel
              tar -xf "$INNER_TAR" -C real_kernel --strip-components=1
              KERNEL_ROOT=$(find real_kernel -type d -name "arch" \
                | head -1 | xargs dirname)
            fi
          fi

          echo "KERNEL ROOT: $KERNEL_ROOT"
          ls $KERNEL_ROOT/arch/arm64/configs/

          DEFCONFIG=$(ls $KERNEL_ROOT/arch/arm64/configs/ \
            | grep -i "defconfig" | head -1)
          echo "Using: $DEFCONFIG"

          cd $KERNEL_ROOT
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               modules_prepare -j$(nproc)

          echo $KERNEL_ROOT > /tmp/kernel_root.txt

      - name: Build dfroot.ko
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          KERNEL_ROOT=$(cat /tmp/kernel_root.txt)
          echo "Building against: $KERNEL_ROOT"
          make -C $KERNEL_ROOT \
               M=$(pwd)/lkm \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               modules -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-ko-A037F-4.19
          path: lkm/dfroot.ko
          if-no-files-found: error
