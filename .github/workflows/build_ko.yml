name: Build dfroot.ko for SM-A037F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make bc libssl-dev \
            unzip python3 python3-pip
          pip3 install gdown

      - name: Download kernel source from Drive
        run: |
          gdown "1W3tCzo5yjEpepyIxIgloen-gHEruCLgq" -O kernel_src.zip

      - name: Extract kernel source
        run: |
          unzip kernel_src.zip -d kernel_raw
          INNER=$(find kernel_raw -name "*.tar.gz" | head -1)
          if [ -n "$INNER" ]; then
            mkdir kernel_src
            tar -xzf "$INNER" -C kernel_src --strip-components=1
          else
            mv kernel_raw kernel_src
          fi

      - name: Prepare kernel headers
        run: |
          cd kernel_src
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          DEFCONFIG=$(find . -name "*a03*defconfig" \
            -o -name "*A037*defconfig" 2>/dev/null | head -1)
          echo "Using: $DEFCONFIG"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               $(basename $DEFCONFIG)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               modules_prepare -j$(nproc)

      - name: Build dfroot.ko
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -C $(pwd)/kernel_src \
               M=$(pwd)/lkm \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               modules -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-ko-A037F-4.19
          path: lkm/dfroot.ko
          if-no-files-found: error
