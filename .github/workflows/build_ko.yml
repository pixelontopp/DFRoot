name: Build dfroot.ko for SM-A037F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            clang lld llvm \
            make bc libssl-dev \
            unzip python3 dos2unix \
            libelf-dev

      - name: Download kernel source
        run: |
          wget -O kernel_src.zip \
            "https://github.com/pixelontopp/DFRoot/releases/download/%23idk/SM-A037F_13_Opensource.zip"
          ls -lh kernel_src.zip

      - name: Extract kernel source
        run: |
          unzip kernel_src.zip -d kernel_raw
          KERNEL_TAR=$(find kernel_raw -iname "kernel.tar.gz" | head -1)
          echo "Kernel tar at: $KERNEL_TAR"
          mkdir -p kernel_src
          tar -xzf "$KERNEL_TAR" -C kernel_src
          ls kernel_src/

      - name: Fix toolchain and encoding
        run: |
          cd kernel_src

          # Create fake clang path Samsung's Makefile expects
          mkdir -p toolchain/clang/host/linux-x86/clang-r383902/bin
          ln -sf $(which clang) \
            toolchain/clang/host/linux-x86/clang-r383902/bin/clang
          ln -sf $(which clang++) \
            toolchain/clang/host/linux-x86/clang-r383902/bin/clang++

          echo "Clang symlink:"
          ls -la toolchain/clang/host/linux-x86/clang-r383902/bin/

          # Fix CRLF in all Kconfig files
          find . -name "Kconfig" -exec dos2unix {} \; 2>/dev/null || true

          cd ..

      - name: Prepare kernel headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          ARCH_DIR=$(find kernel_src -type d -name "arch" | head -1)
          KERNEL_ROOT=$(dirname "$ARCH_DIR")
          echo "Kernel root: $KERNEL_ROOT"

          cd "$KERNEL_ROOT"

          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               a03s_00_defconfig

          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               modules_prepare -j$(nproc)

          echo "$KERNEL_ROOT" > /tmp/kernel_root.txt

      - name: Build dfroot.ko
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          KERNEL_ROOT=$(cat /tmp/kernel_root.txt)
          echo "Building against: $KERNEL_ROOT"

          make -C "$KERNEL_ROOT" \
               M=$(pwd)/lkm \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               modules -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-ko-A037F-4.19
          path: lkm/dfroot.ko
          if-no-files-found: error
