name: Build dfroot.ko for SM-A037F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make bc libssl-dev \
            unzip python3

      - name: Download kernel source
        run: |
          wget -O kernel_src.zip \
            "https://github.com/pixelontopp/DFRoot/releases/download/%23idk/SM-A037F_13_Opensource.zip"
          ls -lh kernel_src.zip

      - name: Extract kernel source
        run: |
          unzip kernel_src.zip -d kernel_raw
          INNER=$(find kernel_raw -name "*.tar.gz" | head -1)
          if [ -n "$INNER" ]; then
            echo "Found inner archive: $INNER"
            mkdir kernel_src
            tar -xzf "$INNER" -C kernel_src --strip-components=1
          else
            mv kernel_raw kernel_src
          fi
          echo "=== Root contents ==="
          ls kernel_src/

      - name: Find defconfig
        run: |
          echo "=== arch/arm64/configs ==="
          ls kernel_src/arch/arm64/configs/ || echo "DIR NOT FOUND"
          echo "=== All defconfigs in tree ==="
          find kernel_src -name "*defconfig*" | head -40
          echo "=== Kernel source root ==="
          ls kernel_src/

      - name: Prepare kernel headers
        run: |
          cd kernel_src
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" \
            | head -1 | xargs basename)
          echo "Auto-picked defconfig: $DEFCONFIG"

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No defconfig found. Full tree:"
            find . -name "*defconfig*"
            exit 1
          fi

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               $DEFCONFIG
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               modules_prepare -j$(nproc)

      - name: Build dfroot.ko
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -C $(pwd)/kernel_src \
               M=$(pwd)/lkm \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               modules -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-ko-A037F-4.19
          path: lkm/dfroot.ko
          if-no-files-found: error
