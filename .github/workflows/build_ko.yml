name: Build dfroot.ko for SM-A037F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make bc libssl-dev \
            unzip python3

      - name: Download kernel source
        run: |
          wget -O kernel_src.zip \
            "https://github.com/pixelontopp/DFRoot/releases/download/%23idk/SM-A037F_13_Opensource.zip"
          ls -lh kernel_src.zip

      - name: Extract kernel source
        run: |
          unzip kernel_src.zip -d kernel_raw
          INNER=$(find kernel_raw -name "*.tar.gz" | head -1)
          if [ -n "$INNER" ]; then
            echo "Found inner archive: $INNER"
            mkdir kernel_src
            tar -xzf "$INNER" -C kernel_src --strip-components=1
          else
            mv kernel_raw kernel_src
          fi
          echo "=== Top level ==="
          ls kernel_src/
          echo "=== Second level ==="
          ls kernel_src/*/ 2>/dev/null | head -40

      - name: Find defconfig
        run: |
          echo "=== Locating arch/arm64 ==="
          find . -type d -name "arm64" | head -10
          echo "=== Locating Makefile ==="
          find . -name "Makefile" -maxdepth 4 | head -10
          echo "=== All defconfigs ==="
          find . -name "*defconfig*" | head -30

      - name: Prepare kernel headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Find actual kernel root (where Makefile + arch both exist)
          KERNEL_ROOT=$(find . -name "Makefile" -maxdepth 4 \
            | xargs -I{} dirname {} \
            | while read d; do
                [ -d "$d/arch" ] && echo "$d" && break
              done)

          echo "Kernel root: $KERNEL_ROOT"
          cd $KERNEL_ROOT

          # Find defconfig
          DEFCONFIG=$(find arch/arm64/configs/ \
            -name "*defconfig" | head -1 | xargs basename)
          echo "Using defconfig: $DEFCONFIG"

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               $DEFCONFIG
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               modules_prepare -j$(nproc)

          # Save kernel root path for next step
          echo $KERNEL_ROOT > /tmp/kernel_root.txt

      - name: Build dfroot.ko
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          KERNEL_ROOT=$(cat /tmp/kernel_root.txt)
          echo "Building against: $KERNEL_ROOT"
          make -C $KERNEL_ROOT \
               M=$(pwd)/lkm \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               modules -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-ko-A037F-4.19
          path: lkm/dfroot.ko
          if-no-files-found: error
